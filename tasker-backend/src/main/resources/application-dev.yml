spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tasker_dev
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev

logging:
  level:
    com.tasker: DEBUG
    org.hibernate.SQL: DEBUG
